name: E2E Tests with API Gateway & Lambda

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # 手動実行用トリガー

env:
  AWS_REGION: ap-northeast-1
  APP_NAME: lambda-api-gw-go
  TF_STATE_BUCKET: your-tf-state-bucket  # GitHub Actionsが使用するTerraform状態を保存するバケット
  # ステージ名をGitHub Actionsの実行IDでユニークにする（リソース名衝突を防ぐ）
  STAGE_NAME: e2e-${{ github.run_id }}
  DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}

jobs:
  e2e-test:
    name: E2E Test with API Gateway & Lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OpenID Connect認証に必要
      contents: read    # リポジトリ内容の読み取り
    
    # services:
    #   mysql:
    #     image: mysql:8.0
    #     env:
    #       MYSQL_ROOT_PASSWORD: rootpass
    #       MYSQL_DATABASE: testdb
    #       MYSQL_USER: testuser
    #       MYSQL_PASSWORD: testpass
    #     ports:
    #       - 3306:3306
    #     options: >-
    #       --health-cmd="mysqladmin ping --silent" 
    #       --health-interval=10s 
    #       --health-timeout=5s 
    #       --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      
      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Build SAM application
        run: |
          sam build

      - name: Setup custom network and MySQL container
        run: |
          # カスタムネットワーク作成
          docker network create samlocal-network
          
          # MySQLコンテナを起動
          docker run -d --name mysql-db --network samlocal-network \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            -e MYSQL_DATABASE=stock_db \
            -e MYSQL_USER=testuser \
            -e MYSQL_PASSWORD=testpass \
            mysql:8.0
          
          # データベースの起動待ち
          sleep 15
          
          # テストデータ初期化
          docker exec mysql-db mysql -utestuser -ptestpass stock_db -e "CREATE TABLE IF NOT EXISTS stocks (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(255), amount INT);"
          docker exec mysql-db mysql -utestuser -ptestpass stock_db -e "INSERT INTO stocks (name, amount) VALUES ('apple', 100), ('banana', 200);"
          
          # env.jsonファイルを作成（コンテナ名をホストとして使用）
          cat > env.json << EOF
          {
            "StockFunction": {
              "DB_HOST": "mysql-db",
              "DB_PORT": "3306",
              "MYSQL_USER": "testuser",
              "MYSQL_PASSWORD": "testpass",
              "MYSQL_DATABASE": "stock_db"
            }
          }
          EOF
          
          # 同じネットワーク上でSAM Local実行
          sam local start-api --env-vars env.json --docker-network samlocal-network &
          
          # APIの起動待ち
          sleep 15
          
          # API呼び出しでテスト
          curl -v "http://localhost:3000/v1/stocks" | jq .

      - name: Debug database permissions
        run: |
          # データベース一覧の確認
          docker exec mysql-db mysql -uroot -prootpass -e "SHOW DATABASES;"
          
          # ユーザー権限の確認
          docker exec mysql-db mysql -uroot -prootpass -e "SELECT User, Host, Db FROM mysql.db WHERE User='testuser';"
          docker exec mysql-db mysql -uroot -prootpass -e "SHOW GRANTS FOR 'testuser'@'%';"
          
          # stock_dbの存在確認
          docker exec mysql-db mysql -uroot -prootpass -e "USE stock_db; SHOW TABLES;"

      - name: Debug network configuration
        run: |
          # Docker環境情報を表示
          docker info
          
          # ネットワーク設定を確認
          docker network ls
          
          # MySQLコンテナの状態を確認
          docker ps
          docker logs mysql-test
          
          # ネットワーク接続テスト
          docker run --rm curlimages/curl curl -v telnet://mysql-test:3306
          
          # ホストからのMySQL接続テスト
          mysql -h 127.0.0.1 -P 3306 -u testuser -ptestpass testdb -e "SELECT 1"

      - name: Run local API tests
        run: |
          # SAM Localを使用してLambdaとAPI Gatewayをローカルで実行
          sam local start-api --env-vars env.json &
          
          # APIが起動するまで待機
          sleep 10
          
          # ローカルAPIにリクエスト
          curl -s "http://localhost:3000/v1/stocks" | jq .

      - name: Cleanup test stack
        if: always()
        run: |
          sam delete --stack-name my-api-test-${{ github.run_id }} --no-prompts --region ap-northeast-1

  actions-timeline:
    name: Actions Timeline
    needs: [e2e-test]

    runs-on: ubuntu-latest
    steps:
      - uses: Kesin11/actions-timeline@v2